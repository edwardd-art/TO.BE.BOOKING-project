version = "0.1.0"
description = ""
authors = [
    {name = "Edward Mirzoyants",email = "Edward532398@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django (==5.2)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
