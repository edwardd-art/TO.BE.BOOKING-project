{% extends 'base.html' %}

{% block title %}Вход — TO.BE.BAR{% endblock %}

{% block content %}
<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card-dark">
                <h2 class="gold-title text-center" style="font-size: 28px;">Вход</h2>
                <div class="gold-line"></div>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label" style="color: var(--gray); font-size: 13px; letter-spacing: 1px;">ИМЯ ПОЛЬЗОВАТЕЛЯ</label>
                        <input type="text" name="username" class="form-control dark-input" placeholder="Введите логин" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" style="color: var(--gray); font-size: 13px; letter-spacing: 1px;">ПАРОЛЬ</label>
                        <input type="password" name="password" class="form-control dark-input" placeholder="Введите пароль" required>
                    </div>
                    <button type="submit" class="btn btn-gold w-100">Войти</button>
                </form>

                <p class="text-center mt-3" style="color: #b0b0b0; font-size: 15px;">
                    Нет аккаунта? <a href="{% url 'register' %}" style="color: #d4a843; font-weight: 700; font-size: 16px;">Зарегистрироваться</a>
                </p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
