{% extends 'base.html' %}

{% block title %}Регистрация — TO.BE.BAR{% endblock %}

{% block content %}
<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card-dark">
                <h2 class="gold-title text-center" style="font-size: 28px;">Регистрация</h2>
                <div class="gold-line"></div>

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-danger">{{ message }}</div>
                    {% endfor %}
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label" style="color: var(--gray); font-size: 13px; letter-spacing: 1px;">ИМЯ ПОЛЬЗОВАТЕЛЯ</label>
                        <input type="text" name="username" class="form-control dark-input" placeholder="Придумайте логин" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" style="color: var(--gray); font-size: 13px; letter-spacing: 1px;">EMAIL</label>
                        <input type="email" name="email" class="form-control dark-input" placeholder="Ваш email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" style="color: var(--gray); font-size: 13px; letter-spacing: 1px;">ПАРОЛЬ</label>
                        <input type="password" name="password1" class="form-control dark-input" placeholder="Придумайте пароль" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" style="color: var(--gray); font-size: 13px; letter-spacing: 1px;">ПОДТВЕРЖДЕНИЕ ПАРОЛЯ</label>
                        <input type="password" name="password2" class="form-control dark-input" placeholder="Повторите пароль" required>
                    </div>
                    <button type="submit" class="btn btn-gold w-100">Зарегистрироваться</button>
                </form>

                <p class="text-center mt-3" style="color: #b0b0b0;">
                    Уже есть аккаунт? <a href="{% url 'login' %}" style="color: #d4a843;">Войти</a>
                </p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
