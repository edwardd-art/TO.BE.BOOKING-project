{% extends 'base.html' %}

{% block title %}Редактирование бронирования — TO.BE.BAR{% endblock %}

{% block content %}
<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card-dark">
                <h3 class="gold-title text-center" style="font-size: 24px;">Редактирование бронирования #{{ booking.id }}</h3>
                <div class="gold-line"></div>

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label" style="color: var(--gray); font-size: 13px; letter-spacing: 1px;">ДАТА</label>
                        <input type="date" name="date" class="form-control dark-input" value="{{ booking.date|date:'Y-m-d' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" style="color: var(--gray); font-size: 13px; letter-spacing: 1px;">ВРЕМЯ</label>
                        <input type="time" name="time" class="form-control dark-input" value="{{ booking.time_start|time:'H:i' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" style="color: var(--gray); font-size: 13px; letter-spacing: 1px;">КОЛИЧЕСТВО ГОСТЕЙ</label>
                        <select name="guests" class="form-control dark-input" required>
                            <option value="2" {% if booking.guests_count == 2 %}selected{% endif %}>2 человека</option>
                            <option value="3" {% if booking.guests_count == 3 %}selected{% endif %}>3 человека</option>
                            <option value="4" {% if booking.guests_count == 4 %}selected{% endif %}>4 человека</option>
                            <option value="5" {% if booking.guests_count == 5 %}selected{% endif %}>5 человек</option>
                            <option value="6" {% if booking.guests_count == 6 %}selected{% endif %}>6 человек</option>
                            <option value="8" {% if booking.guests_count == 8 %}selected{% endif %}>8+ человек</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" style="color: var(--gray); font-size: 13px; letter-spacing: 1px;">КОММЕНТАРИЙ</label>
                        <textarea name="comment" class="form-control dark-input" rows="2">{{ booking.comment }}</textarea>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-gold w-100">Сохранить изменения</button>
                        <a href="{% url 'profile' %}" class="btn btn-outline-gold w-100">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
